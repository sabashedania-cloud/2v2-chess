<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2v2 Chess Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>2v2 Chess Online</h1>

  <div id="onlineBox">
    <button id="createRoomBtn">Create Room</button>
    <input id="roomCodeInput" placeholder="Room Code">
    <button id="joinRoomBtn">Join Room</button>
    <div id="roomInfo">Room: not connected</div>
    <div id="playerInfo">You are: not joined</div>
    <div id="playersInfo">Players: 0/4</div>
  </div>

  <p id="turnText">Turn: White1</p>

  <div id="timers">
    <div>White Time: <span id="whiteTimer">10:00</span></div>
    <div>Black Time: <span id="blackTimer">10:00</span></div>
  </div>

  <button id="restartBtn">Restart Game</button>

  <div class="game-container">
    <div id="board"></div>

    <div id="historyBox">
      <h2>Move History</h2>
      <ol id="moveHistory"></ol>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
