<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2v2 Chess Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>2v2 Chess Admin Panel</h1>

  <div class="admin-toolbar">
    <a class="admin-link" href="index.html">Back to Game</a>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div class="admin-summary">
    <div class="admin-stat">Rooms: <span id="totalRooms">0</span></div>
    <div class="admin-stat">Waiting: <span id="waitingRooms">0</span></div>
    <div class="admin-stat">Playing: <span id="playingRooms">0</span></div>
    <div class="admin-stat">Finished: <span id="finishedRooms">0</span></div>
  </div>

  <div id="adminRooms" class="admin-rooms">
    <div class="empty-admin">Loading rooms...</div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
